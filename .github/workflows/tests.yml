name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tests mock the external Navamsha API — no real API key is needed.
      # The ASTROLOGY_API_KEY and SECRET_KEY below are safe placeholder
      # values used only for the test environment.
      - name: Set environment variables for tests
        run: |
          echo "ASTROLOGY_API_KEY=ci-test-placeholder-key" >> $GITHUB_ENV
          echo "SECRET_KEY=ci-test-secret-key-$(openssl rand -hex 16)" >> $GITHUB_ENV

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests with coverage
        run: python -m pytest tests/ --cov=app --cov-report=term-missing
