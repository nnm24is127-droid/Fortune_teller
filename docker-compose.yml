services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astro-teller-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./data/astro_teller.db
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health/live').getcode() == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
